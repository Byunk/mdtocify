name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package.json version
        run: |
          if git diff --name-only origin/main...HEAD | grep -q "package.json"; then
            echo "package.json has been modified"
            # Check if version was bumped
            OLD_VERSION=$(git show origin/main:package.json | jq -r '.version')
            NEW_VERSION=$(jq -r '.version' package.json)
            if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
              echo "::error::Package version should be bumped when package.json is modified"
              exit 1
            fi
            echo "Version bumped from $OLD_VERSION to $NEW_VERSION"
          fi

      - name: Check for lockfile changes
        run: |
          if git diff --name-only origin/main...HEAD | grep -q "pnpm-lock.yaml"; then
            echo "pnpm-lock.yaml has been modified"
            # Verify lockfile is in sync
            pnpm install --frozen-lockfile --dry-run
          fi

      - name: Run tests with coverage
        run: pnpm run test:coverage
